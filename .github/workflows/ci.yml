name: CI

on:
  push:
    branches: ["main", "feat/**", "chore/**", "fix/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint with ruff
        run: ruff check .

      - name: Type-check with mypy (--strict)
        run: mypy

      - name: Run unit and integration tests
        run: pytest -q

      - name: Run offline evaluation benchmark smoke test
        run: python -m evals.run_evals --count 12 --seed 1000 --offline --out-dir /tmp/evals

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        run: docker build -t docextract:ci .
