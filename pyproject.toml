[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docextract"
version = "0.1.0"
description = "Verified invoice and receipt extraction pipeline: PDF/OCR layout parsing, grounded LLM schema extraction, deterministic math/tax/checksum validation, and human-in-the-loop review queue."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Paul Andrei Datinguinoo" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlmodel>=0.0.21",
    "httpx>=0.27",
    "litellm>=1.50",
    "pypdfium2>=4.30",
    "pillow>=10.3",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ocr = [
    "rapidocr-onnxruntime>=1.3",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
]
datagen = [
    "reportlab>=4.2",
    "faker>=25.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "reportlab>=4.2",
    "faker>=25.0",
]

[project.scripts]
docextract-datagen = "datagen.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docextract", "datagen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
files = ["src", "datagen"]
